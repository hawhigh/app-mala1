<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple PDF Editor & Converter</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load pdf.js for rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <!-- Load pdf-lib for manipulation -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <!-- Download helper -->
    <script src="https://unpkg.com/downloadjs@1.4.7/download.min.js"></script>
    <!-- JSZip for zipping images -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>PDF Editor & Converter</h1>
            <p>Upload PDF to edit, or images to convert. Add text, rotate, delete, or export pages.</p>
        </header>

        <div class="toolbar">
            <div class="file-section">
                <div class="upload-group">
                    <label for="pdfInput" class="btn btn-primary">📂 Open PDF</label>
                    <input type="file" id="pdfInput" accept=".pdf" hidden>
                </div>
                <div class="upload-group">
                    <label for="imageInput" class="btn btn-primary btn-outline">🖼️ Images to PDF</label>
                    <input type="file" id="imageInput" accept="image/*" multiple hidden>
                </div>
                <span id="fileName">No file selected</span>
            </div>

            <div class="actions" id="actions" style="display: none;">
                <!-- Page Ops -->
                <div class="action-group">
                    <button id="rotateLeftBtn" class="btn btn-secondary" title="Rotate Left">↺</button>
                    <button id="rotateRightBtn" class="btn btn-secondary" title="Rotate Right">↻</button>
                    <button id="deleteBtn" class="btn btn-danger" title="Delete Selected">🗑</button>
                </div>

                <div class="divider"></div>

                <!-- Edit Text -->
                <div class="action-group edit-group">
                    <input type="text" id="textInput" placeholder="Text to add...">
                    <input type="color" id="textColor" value="#000000">
                    <button id="addTextBtn" class="btn btn-secondary">Add Text</button>
                </div>

                <div class="divider"></div>

                <!-- Export -->
                <div class="action-group">
                    <button id="exportImagesBtn" class="btn btn-secondary" title="Export Selected as Images">🖼️ Export Imgs</button>
                    <button id="saveBtn" class="btn btn-success">💾 Save PDF</button>
                </div>
            </div>
        </div>

        <div id="loader" class="loader" style="display: none;">Processing...</div>

        <div id="gridContainer" class="grid-container">
            <!-- Thumbnails will be injected here -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
