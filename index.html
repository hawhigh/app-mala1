<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple PDF Editor</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load pdf.js for rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <!-- Load pdf-lib for manipulation -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <!-- Download helper -->
    <script src="https://unpkg.com/downloadjs@1.4.7/download.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>PDF Page Manager</h1>
            <p>Upload a PDF, select pages, rotate, or delete them.</p>
        </header>

        <div class="toolbar">
            <div class="file-upload">
                <label for="pdfInput" class="btn btn-primary">Select PDF</label>
                <input type="file" id="pdfInput" accept=".pdf" hidden>
                <span id="fileName">No file selected</span>
            </div>

            <div class="actions" id="actions" style="display: none;">
                <button id="rotateLeftBtn" class="btn btn-secondary">↺ Rotate Left</button>
                <button id="rotateRightBtn" class="btn btn-secondary">↻ Rotate Right</button>
                <button id="deleteBtn" class="btn btn-danger">🗑 Delete Selected</button>
                <div class="divider"></div>
                <button id="saveBtn" class="btn btn-success">💾 Save New PDF</button>
            </div>
        </div>

        <div id="loader" class="loader" style="display: none;">Loading PDF...</div>

        <div id="gridContainer" class="grid-container">
            <!-- Thumbnails will be injected here -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
